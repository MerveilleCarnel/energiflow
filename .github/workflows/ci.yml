name: CI - EnergiFlow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8

      - name: "Vérifier la syntaxe de tous les scripts Python"
        run: |
          python -m py_compile collecte/*.py airflow/dags/*.py airflow/scripts/*.py analyse/*.py spark/*.py

      - name: "Lint (erreurs bloquantes uniquement: syntaxe, imports, variables non définies)"
        run: |
          flake8 collecte/ airflow/dags/ airflow/scripts/ analyse/ spark/ --select=E9,F63,F7,F82 --show-source

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - uses: actions/checkout@v4

      - name: Build image collecte
        run: docker build -t energiflow-collecte:ci ./collecte

      - name: Build image airflow
        run: docker build -t energiflow-airflow:ci ./airflow

      - name: Build image analyse
        run: docker build -t energiflow-analyse:ci ./analyse

      - name: Build image spark
        run: docker build -t energiflow-spark:ci ./spark
  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Calculer le nom du propriétaire en minuscules
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push image collecte
        run: |
          docker build -t ghcr.io/${{ env.OWNER_LC }}/energiflow-collecte:latest ./collecte
          docker push ghcr.io/${{ env.OWNER_LC }}/energiflow-collecte:latest

      - name: Build et push image airflow
        run: |
          docker build -t ghcr.io/${{ env.OWNER_LC }}/energiflow-airflow:latest ./airflow
          docker push ghcr.io/${{ env.OWNER_LC }}/energiflow-airflow:latest

      - name: Build et push image analyse
        run: |
          docker build -t ghcr.io/${{ env.OWNER_LC }}/energiflow-analyse:latest ./analyse
          docker push ghcr.io/${{ env.OWNER_LC }}/energiflow-analyse:latest

      - name: Build et push image spark
        run: |
          docker build -t ghcr.io/${{ env.OWNER_LC }}/energiflow-spark:latest ./spark
          docker push ghcr.io/${{ env.OWNER_LC }}/energiflow-spark:latest        